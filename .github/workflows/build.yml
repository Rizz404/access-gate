name: build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: build linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o access-gate-linux-amd64 .
          sha256sum access-gate-linux-amd64 > access-gate-linux-amd64.sha256
      - name: publish to rolling release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title latest --notes "Rolling build of main; the server pulls this after the webhook fires."
          gh release upload latest access-gate-linux-amd64 access-gate-linux-amd64.sha256 --clobber
