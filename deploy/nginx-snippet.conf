# Contoh untuk vhost yang dilindungi (mis. route-gateway.nexlabs.cloud). Belum teruji di nginx nyata.
# Sesuaikan upstream; di Plesk letakkan di "Additional nginx directives" domain tsb.

# 1) IP asli klien. Percayai Cloudflare saja; isi dari https://www.cloudflare.com/ips-v4 dan ips-v6.
#    Tanpa ini $remote_addr = IP Cloudflare dan whitelist tidak berguna.
# set_real_ip_from 173.245.48.0/20;   # ... (semua rentang Cloudflare)
# real_ip_header CF-Connecting-IP;

# 2) Lindungi semua path. 401/403 dari gate = tolak; error/timeout gate (5xx) juga = tolak.
auth_request /_gate;
error_page 401 403 = @denied;

location = /_gate {
    internal;
    proxy_pass http://127.0.0.1:9181/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Site "omniroute";       # harus sama dengan nama situs di access-gate
    proxy_set_header X-Real-IP $remote_addr;   # menimpa nilai kiriman klien
}

location @denied {
    return 403 "Forbidden\n";
}
